services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: face_attendance_db
    environment:
      POSTGRES_USER: face
      POSTGRES_PASSWORD: face
      POSTGRES_DB: face_attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
